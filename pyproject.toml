[project]
name = "rdgai"
version = "0.2.0"
description = "Rdgai facilitates the use of LLMs for classifying transitions between variant readings in a Text Encoding Initiative (TEI) XML file containing a critical apparatus."
authors = [{ name = "Robert Turnbull", email = "robert.turnbull@unimelb.edu.au" }]
license = "Apache-2.0"
readme = "README.rst"
requires-python = ">=3.11,<3.15"
keywords = ["command-line interface"]

# For classifiers see https://pypi.org/classifiers/
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "lxml>=5.2.2",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "mcp>=2.3.0",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pydantic-ai-slim[mcp,anthropic,openai]>=2.68",
]

[project.urls]
Homepage = "https://github.com/rbturnbull/rdgai/"
Repository = "https://github.com/rbturnbull/rdgai/"
Documentation = "https://rbturnbull.github.io/rdgai"

[project.scripts]
rdgai = "rdgai.main:app"

[dependency-groups]
dev = [
    "pytest>=6.2.5",
    "httpx>=0.27",
    "ipykernel>=6.6.1",
    "coverage>=5.5",
    "autopep8>=1.5.7",
    "Sphinx>=5.0.0",
    "nbsphinx>=0.8.7",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autobuild>=2021.3.14",
    "myst-parser>=0.15.2",
    "pre-commit>=2.15.0",
    "sphinx-copybutton>=0.4.0",
    "black>=21.10b0",
    "sphinx-click",
]

[tool.uv.sources]
sphinx-click = { git = "https://github.com/rbturnbull/sphinx-click.git" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rdgai"]

[tool.hatch.build.targets.sdist]
# only the package and what it needs: the repository root holds many working files (XML, HTML, spreadsheets)
include = ["rdgai", "tests", "README.rst", "LICENSE", "CONTRIBUTING.rst"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
